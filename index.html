<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ Día de los Hot Wheels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        
        body {
            min-height: 100vh;
            /* Fondo espectacular con colores de atardecer/cielo */
            background: linear-gradient(180deg, 
                #1a237e 0%, 
                #283593 25%, 
                #3949ab 50%, 
                #ff9800 80%, 
                #ff5722 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* --- Estrellitas brillando arriba --- */
        .estrellas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            pointer-events: none;
        }
        .estrella {
            position: absolute;
            font-size: 12px;
            animation: parpadear 2s ease-in-out infinite;
        }
        @keyframes parpadear {
            0%,100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* --- Nubes en movimiento --- */
        .nubes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .nube {
            position: absolute;
            font-size: 80px;
            color: rgba(255, 255, 255, 0.25);
            animation: flotar-nube linear infinite;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
        }
        @keyframes flotar-nube {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        /* --- Sol brillando abajo --- */
        .sol {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 120px;
            opacity: 0.8;
            filter: drop-shadow(0 0 30px #ffcc00);
            animation: sol-latir 4s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes sol-latir {
            0%,100% { transform: translateX(-50%) scale(1); filter: drop-shadow(0 0 30px #ffcc00); }
            50% { transform: translateX(-50%) scale(1.05); filter: drop-shadow(0 0 50px #ffcc00); }
        }

        /* --- Montañas/colinas decorativas --- */
        .montañas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, transparent 0%, rgba(26, 35, 126, 0.4) 100%);
            z-index: 2;
        }

        /* --- Título --- */
        h1 {
            font-size: 2.6rem;
            margin-bottom: 60px;
            color: #ffcc00;
            text-shadow: 
                0 0 10px #ffcc00,
                0 0 20px #ff9900,
                0 0 30px #ff6600;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: aparecer-titulo 1.5s ease-out;
        }
        @keyframes aparecer-titulo {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Menú de botones --- */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 10;
            animation: aparecer-menu 2s ease-out 0.3s both;
        }
        @keyframes aparecer-menu {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Botones hermosos --- */
        .boton {
            padding: 22px 45px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s ease;
            width: 330px;
            text-align: center;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }
        .boton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .boton:hover::before {
            left: 100%;
        }
        .boton:hover {
            transform: scale(1.08) translateY(-3px);
        }

        /* Botón 1: Naranja/Velocidad */
        .b1 {
            background: linear-gradient(135deg, #ffcc00, #ff9900, #ff6600);
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.5);
        }
        .b1:hover {
            box-shadow: 0 10px 30px rgba(255, 153, 0, 0.7);
        }

        /* Botón 2: Azul/Carta */
        .b2 {
            background: linear-gradient(135deg, #4169e1, #1e90ff, #00bfff);
            color: white;
            box-shadow: 0 6px 20px rgba(30, 144, 255, 0.5);
        }
        .b2:hover {
            box-shadow: 0 10px 30px rgba(30, 144, 255, 0.7);
        }

        /* Botón 3: Turquesa/Rosas */
        .b3 {
            background: linear-gradient(135deg, #00ced1, #40e0d0, #7fffd4);
            box-shadow: 0 6px 20px rgba(0, 206, 209, 0.5);
        }
        .b3:hover {
            box-shadow: 0 10px 30px rgba(0, 206, 209, 0.7);
        }

        /* Responsivo */
        @media(max-width: 400px) {
            h1 { font-size: 1.8rem; }
            .boton { width: 280px; font-size: 1.1rem; padding: 18px 30px; }
            .nube { font-size: 60px; }
        }
    </style>
</head>
<body>

    <!-- ⭐ Estrellitas arriba -->
    <div class="estrellas" id="estrellas"></div>

    <!-- ☁️ Nubes que pasan -->
    <div class="nubes" id="nubes"></div>

    <!-- ☀️ Sol -->
    <div class="sol">☀️</div>

    <!-- 🏔️ Montañas decorativas -->
    <div class="montañas"></div>

    <h1>🏎️✨ ¡Feliz Día de los Hot Wheels! ✨🏎️</h1>

    <div class="menu">
        <a href="seccion1/pagina1.html" class="boton b1">🏁🥰 A NUESTRA VELOCIDAD 🏁🥰</a>
        <a href="seccion2/pagina2.html" class="boton b2">😍UNA CARTA PARA MI PERSONA ESPECIAL😍</a>
        <a href="seccion3/pagina3.html" class="boton b3">😛 SUS ROSAS MOCHE😛</a>
    </div>

    <script>
        // Generar estrellitas automáticamente
        const contenedorEstrellas = document.getElementById('estrellas');
        for (let i = 0; i < 30; i++) {
            const estrella = document.createElement('span');
            estrella.className = 'estrella';
            estrella.textContent = '✦';
            estrella.style.left = `${Math.random() * 100}%`;
            estrella.style.top = `${Math.random() * 100}%`;
            estrella.style.animationDelay = `${Math.random() * 2}s`;
            contenedorEstrellas.appendChild(estrella);
        }

        // Generar nubes en movimiento
        const contenedorNubes = document.getElementById('nubes');
        const nubesEmoji = ['☁️', '☁️', '☁️', '⛅', '☁️', '💕', '😍'];
        for (let i = 0; i < 8; i++) {
            const nube = document.createElement('span');
            nube.className = 'nube';
            nube.textContent = nubesEmoji[Math.floor(Math.random() * nubesEmoji.length)];
            nube.style.top = `${5 + Math.random() * 40}%`;
            nube.style.animationDuration = `${20 + Math.random() * 30}s`;
            nube.style.animationDelay = `${-Math.random() * 30}s`;
            contenedorNubes.appendChild(nube);
        }
    </script>

</body>
</html>
