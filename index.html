<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Día de los Hot Wheels & Iron Man 🚗</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, 
                #0a0a0a 0%, 
                #1a1a1a 25%, 
                #8b0000 50%, 
                #ff4500 75%, 
                #ffd700 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .energia {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .particula {
            position: absolute;
            font-size: 14px;
            animation: brillar 2s ease-in-out infinite;
            filter: drop-shadow(0 0 6px #ffd700);
        }
        @keyframes brillar {
            0%,100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
        }
        .repulsores {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .repulsor {
            position: absolute;
            font-size: 60px;
            animation: desplazar-repulsor linear infinite;
            filter: drop-shadow(0 0 15px #00bfff);
        }
        @keyframes desplazar-repulsor {
            0% { transform: translateX(-150px) translateY(0); }
            100% { transform: translateX(calc(100vw + 150px)) translateY(0); }
        }
        .reactor {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 140px;
            opacity: 0.9;
            filter: drop-shadow(0 0 40px #00bfff) drop-shadow(0 0 60px #00ffff);
            animation: latir-reactor 3s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes latir-reactor {
            0%,100% { 
                transform: translateX(-50%) scale(1); 
                filter: drop-shadow(0 0 40px #00bfff) drop-shadow(0 0 60px #00ffff);
            }
            50% { 
                transform: translateX(-50%) scale(1.1); 
                filter: drop-shadow(0 0 60px #00bfff) drop-shadow(0 0 90px #00ffff);
            }
        }
        .lineas-armadura {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(180deg, transparent 0%, rgba(139, 0, 0, 0.5) 100%);
            border-top: 2px solid rgba(255, 215, 0, 0.3);
            z-index: 2;
        }
        h1 {
            font-size: 2.6rem;
            margin-bottom: 60px;
            color: #ffd700;
            text-shadow: 
                0 0 10px #ffd700,
                0 0 20px #ff4500,
                0 0 30px #ff0000,
                0 0 40px #b22222;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: aparecer-titulo 1.5s ease-out;
        }
        @keyframes aparecer-titulo {
            from { opacity: 0; transform: translateY(-30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
            z-index: 10;
            animation: aparecer-menu 2s ease-out 0.3s both;
        }
        @keyframes aparecer-menu {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .boton {
            padding: 22px 45px;
            font-size: 1.3rem;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s ease;
            width: 330px;
            text-align: center;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }
        .boton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }
        .boton:hover::before {
            left: 100%;
        }
        .boton:hover {
            transform: scale(1.05) translateY(-4px);
        }
        .b1 {
            background: linear-gradient(135deg, #b22222, #ff4500, #ffd700);
            box-shadow: 0 6px 20px rgba(255, 69, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            border-color: #ffd700;
        }
        .b1:hover {
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.4);
        }
        .b2 {
            background: linear-gradient(135deg, #0066cc, #0099ff, #00ccff);
            box-shadow: 0 6px 20px rgba(0, 153, 255, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            border-color: #00ffff;
        }
        .b2:hover {
            box-shadow: 0 10px 30px rgba(0, 153, 255, 0.7), 0 0 20px rgba(255, 255, 255, 0.4);
        }
        .b3 {
            background: linear-gradient(135deg, #ffcc00, #ffd700, #ffed4e);
            color: #222;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.3);
            border-color: #fff;
        }
        .b3:hover {
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.7), 0 0 20px rgba(255, 255, 0, 0.4);
        }
        @media(max-width: 400px) {
            h1 { font-size: 1.6rem; }
            .boton { width: 280px; font-size: 1.1rem; padding: 18px 30px; }
            .repulsor { font-size: 45px; }
            .reactor { font-size: 100px; }
        }
    </style>
</head>
<body>
    <div class="energia" id="energia"></div>
    <div class="repulsores" id="repulsores"></div>
    <div class="reactor">🔋</div>
    <div class="lineas-armadura"></div>
    
    <h1>🤖🏎️ ¡Iron Man & Hot Wheels! 🏎️🤖<br>✨ Día Especial ✨</h1>
    
    <div class="menu">
        <a href="seccion1/pagina1.html" class="boton b1">🏁🔥 A NUESTRA VELOCIDAD 🔥🏁</a>
        <a href="seccion2/pagina2.html" class="boton b2">💙⚡ CARTA PARA TI ⚡💙</a>
        <a href="seccion3/pagina3.html" class="boton b3">🌟🌹 ALGO ESPECIAL 🌹🌟</a>
    </div>

    <!-- 🎵 MÚSICA GLOBAL - SIN BOTONES, CONTINUA SIN CORTARSE -->
    <audio id="musicaGlobal" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    

    <script>
        // Partículas
        const contenedorEnergia = document.getElementById('energia');
        const simbolosEnergia = ['⚡', '✦', '✧', '⚛', '✦', '⚡'];
        for (let i = 0; i < 35; i++) {
            const part = document.createElement('span');
            part.className = 'particula';
            part.textContent = simbolosEnergia[Math.floor(Math.random() * simbolosEnergia.length)];
            part.style.left = `${Math.random() * 100}%`;
            part.style.top = `${Math.random() * 60}%`;
            part.style.animationDelay = `${Math.random() * 2.5}s`;
            part.style.fontSize = `${10 + Math.random() * 10}px`;
            contenedorEnergia.appendChild(part);
        }

        // Repulsores
        const contenedorRepulsores = document.getElementById('repulsores');
        const iconos = ['😍', '🔥', '⚡', '🛡️', '💫', '🔧', '✨', '🏎️'];
        for (let i = 0; i < 6; i++) {
            const rep = document.createElement('span');
            rep.className = 'repulsor';
            rep.textContent = iconos[Math.floor(Math.random() * iconos.length)];
            rep.style.top = `${10 + Math.random() * 50}%`;
            rep.style.animationDuration = `${15 + Math.random() * 25}s`;
            rep.style.animationDelay = `${-Math.random() * 25}s`;
            contenedorRepulsores.appendChild(rep);
        }

        // 🎵 LÓGICA DE MÚSICA - CONTINUA ENTRE PÁGINAS
        const audio = document.getElementById('musicaGlobal');
        audio.volume = 0.7;

        // Recuperar si ya estaba sonando
        const estado = sessionStorage.getItem('musicaActiva');
        if (estado === 'si') {
            const tiempo = parseFloat(sessionStorage.getItem('tiempoMusica') || 0);
            audio.currentTime = tiempo;
            audio.play().catch(() => {});
        }

        // Guardar progreso antes de salir
        window.addEventListener('beforeunload', () => {
            if (!audio.paused) {
                sessionStorage.setItem('musicaActiva', 'si');
                sessionStorage.setItem('tiempoMusica', audio.currentTime);
            }
        });

        // Iniciar con un clic (los navegadores lo requieren)
        document.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                sessionStorage.setItem('musicaActiva', 'si');
            }
        }, { once: true });
    </script>
</body>
</html>
